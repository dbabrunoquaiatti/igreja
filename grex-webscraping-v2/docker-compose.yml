version: '3.8'

services:
  webscraping-grex:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: webscraping-grex

    # Portas
    ports:
      - "8080:8080"

    # Variáveis de ambiente - Customize aqui!
    environment:
      PYTHONUNBUFFERED: 1

    # Volume para dados
    volumes:
      - ./data:/app/data

    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Política de reinicialização
    restart: unless-stopped

    # Limites de recursos (opcional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

